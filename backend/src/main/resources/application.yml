server:
  port: ${PORT:8080}

spring:
  application:
    name: leuven-go
  datasource:
    # PostgreSQL mode so the same Flyway migrations run here and in prod
    url: jdbc:h2:mem:leuvengo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks it matches
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      # browser demo uploads; photos are downscaled to <= 1280px right after
      max-file-size: 5MB
      max-request-size: 6MB

leuvengo:
  traffic:
    # meters - reports within this radius are merged into the same hotspot
    cluster-radius-m: 40
    # reports older than this no longer count towards street scores
    report-ttl-hours: 72
    # merged reports needed before a hotspot is escalated to a Planon work order
    work-order-threshold: 3
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    webhook-url: ${TWILIO_WEBHOOK_URL:}
  storage:
    azure-connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    azure-container: ${AZURE_STORAGE_CONTAINER:trash-photos}
  security:
    pseudonym-secret: ${PSEUDONYM_SECRET:dev-only-pseudonym-secret}
  ml:
    api-url: ${ML_API_URL:http://localhost:8000}
