spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false

leuvengo:
  cors:
    # No fallback on purpose: a prod deploy without ALLOWED_ORIGINS should fail
    # at startup rather than silently block every browser request.
    allowed-origins: ${ALLOWED_ORIGINS}
  security:
    # Also required: changing it later orphans every existing pseudonym.
    pseudonym-secret: ${PSEUDONYM_SECRET}
