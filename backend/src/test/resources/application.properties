# Background jobs off in tests so they never race the assertions.
leuvengo.scheduling.enabled=false

# A database per Spring context. They'd otherwise all share the one named
# in-memory database, so a context closing (or a fresh one seeding) would
# pull the data out from under the others.
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
