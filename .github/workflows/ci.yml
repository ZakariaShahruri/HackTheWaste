name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main queue instead, so
# a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com

  ml:
    name: ML service (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  infra:
    name: Infrastructure (terraform, budget kill switch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest==9.2.0
        working-directory: infra/kill-switch
      - run: pytest -q
        working-directory: infra/kill-switch

  containers:
    name: Containers (images + compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --wait --wait-timeout 300
      - run: scripts/smoke.sh http://localhost:8080
      - name: Service logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # Deploys only from main, only when every check above passed, and only once
  # infra/ has been applied and its outputs saved as repository variables.
  deploy-backend:
    name: Deploy API and ML service (Cloud Run)
    needs: [backend, frontend, ml, infra, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      API_IMAGE: ${{ vars.GCP_REGISTRY }}/api:${{ github.sha }}
      ML_IMAGE: ${{ vars.GCP_REGISTRY }}/ml:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push the images
        run: |
          docker build -t "$ML_IMAGE" ml
          docker build -t "$API_IMAGE" backend
          docker push "$ML_IMAGE"
          docker push "$API_IMAGE"
      # Cloud Run only moves traffic to a revision once its startup probe
      # passes, so a broken image fails the job and the old one keeps serving.
      - name: Roll out, ML service first
        run: |
          gcloud run deploy leuven-go-ml --image "$ML_IMAGE" --region "$REGION" --quiet
          gcloud run deploy leuven-go-api --image "$API_IMAGE" --region "$REGION" --quiet
      - name: Smoke test the live API
        run: scripts/smoke.sh "$(gcloud run services describe leuven-go-api --region "$REGION" --format 'value(status.url)')"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global vercel@66.1.0
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod
